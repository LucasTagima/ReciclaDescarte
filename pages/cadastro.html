<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | ReciclaDescarte</title>
  <meta name="description" content="Crie sua conta no ReciclaDescarte e junte-se ao nosso ecossistema de sustentabilidade urbana.">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>

  <header class="topo">
    <h1>Crie sua conta no ReciclaDescarte</h1>
    <p>Junte-se ao nosso ecossistema de sustentabilidade urbana.</p>
  </header>

  <main>
    <form action="#" method="post">

      
      <fieldset>
        <legend>Quem é você?</legend>

        <div class="opcoes">
          <p>
            <img src="../icon/icon-home.svg" alt="Ícone de morador">
            <input type="radio" id="tipo-morador" name="tipo" value="morador" checked>
            <label for="tipo-morador">
              <strong>Morador</strong><br>
              <small>Quero solicitar coletas</small>
            </label>
          </p>

          <p>
            <img src="../icon/icon-truck.svg" alt="Ícone de empresa de coleta">
            <input type="radio" id="tipo-empresa" name="tipo" value="empresa">
            <label for="tipo-empresa">
              <strong>Empresa de Coleta</strong><br>
              <small>Quero recolher recicláveis</small>
            </label>
          </p>
        </div>
      </fieldset>

      
      <p>
        <label for="nome">Nome Completo / Razão Social</label><br>
        <input type="text" id="nome" name="nome" placeholder="Ana Carolina Santos" required>
      </p>

      
      <div class="linha">
        <p>
          <label for="email">E-mail</label><br>
          <input type="email" id="email" name="email" placeholder="carol@email.com" required>
        </p>

        <p>
          <label for="telefone">Telefone</label><br>
          <input type="tel" id="telefone" name="telefone" placeholder="(xx) 9999-9999" required>
        </p>
      </div>

      
      <p>
        <label for="endereco">Endereço Completo</label><br>
        <input type="text" id="endereco" name="endereco" placeholder="Rua dos Pinheiros, 450 - Pinheiros, São Paulo - SP" required>
      </p>

      
      <div class="linha">
        <p>
          <label for="senha">Senha</label><br>
          <input type="password" id="senha" name="senha" placeholder="••••••••••••" required>
        </p>

        <p>
          <label for="confirmar-senha">Confirmar Senha</label><br>
          <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="••••••••••••" required>
        </p>
      </div>

      
      <p class="termos">
        <input type="checkbox" id="termos" name="termos" checked required>
        <label for="termos">
          Eu aceito os <a href="termos.html">Termos de Serviço</a> e <a href="privacidade.html">Política de Privacidade</a>
        </label>
      </p>

      <button type="submit">Criar Conta</button>

    </form>
  </main>

</body>
</html>
