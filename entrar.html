<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <main class="tela-login ">
        <div>
            <img src="imagens/logo.png" alt="logo reciclaDescarte">
            <h1>Bem-vindo ao ReciclaDescarte</h1>
            <p>Conecte-se e faça a sua parte hoje.</p>
            <form action="#" method="post">
                <fieldset>
                     <label for="email">
                        E-mail
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@email.com"
                        required
                    >
                    <label for="senha">
                        Senha
                    </label>
                    <input 
                    type="password" 
                    name="senha" 
                    id="senha"
                    placeholder="••••••••••••" 
                    required>
                    <a href="#">Esqueceu a senha?</a>
                </fieldset>
                <div class="acoes">
                    <button type="entrar">
                        Entrar
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
